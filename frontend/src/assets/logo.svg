<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#409EFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#67C23A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 外圆环 -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#logoGradient)" stroke-width="3"/>
  
  <!-- 内部设备图标 -->
  <g fill="url(#logoGradient)">
    <!-- 中心处理器 -->
    <rect x="35" y="35" width="30" height="30" rx="3" fill="url(#logoGradient)"/>
    <rect x="40" y="40" width="20" height="20" rx="2" fill="white"/>
    
    <!-- 连接点 -->
    <circle cx="25" cy="25" r="4" fill="url(#logoGradient)"/>
    <circle cx="75" cy="25" r="4" fill="url(#logoGradient)"/>
    <circle cx="25" cy="75" r="4" fill="url(#logoGradient)"/>
    <circle cx="75" cy="75" r="4" fill="url(#logoGradient)"/>
    
    <!-- 连接线 -->
    <line x1="29" y1="25" x2="35" y2="35" stroke="url(#logoGradient)" stroke-width="2"/>
    <line x1="71" y1="25" x2="65" y2="35" stroke="url(#logoGradient)" stroke-width="2"/>
    <line x1="29" y1="75" x2="35" y2="65" stroke="url(#logoGradient)" stroke-width="2"/>
    <line x1="71" y1="75" x2="65" y2="65" stroke="url(#logoGradient)" stroke-width="2"/>
    
    <!-- 数据流动效果 -->
    <circle cx="30" cy="30" r="1.5" fill="#E6A23C">
      <animate attributeName="r" values="1.5;3;1.5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="30" r="1.5" fill="#E6A23C">
      <animate attributeName="r" values="1.5;3;1.5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="70" r="1.5" fill="#E6A23C">
      <animate attributeName="r" values="1.5;3;1.5" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="70" r="1.5" fill="#E6A23C">
      <animate attributeName="r" values="1.5;3;1.5" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>